# Chạy script lúc 07:30, 10:30, 12:30, 15:30 giờ Việt Nam (00:30, 03:30, 05:30, 08:30 UTC). Không dùng AI.
# GitHub có thể chạy trễ 5–30 phút; lịch Claude chuyển file về máy cơ quan lúc 08:00, 11:00, 13:00, 16:00.
name: Cap nhat Ban tin LPS
on:
  schedule:
    - cron: "30 0,3,5,8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ban-tin-lps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Chay script cap nhat
        run: python update_lps.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # để lưu bản sao tệp PDF vào mục Releases của kho
      - name: Luu ket qua
        run: |
          git config user.name "ban-tin-lps-bot"
          git config user.email "ban-tin-lps-bot@users.noreply.github.com"
          git add lps_db.json ban-tin-lps.html logo_lps.png
          git diff --cached --quiet || git commit -m "Cap nhat ban tin $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

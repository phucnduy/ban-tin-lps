# Chạy script 30 phút/lần từ 07:00 đến 17:30 giờ Việt Nam (00:00–10:30 UTC). Không dùng AI.
# Lịch GitHub hay trễ hoặc bỏ lượt nên chạy dày để lịch Claude (08:00, 11:00, 13:00, 16:00) luôn có dữ liệu mới.
# Kho công khai nên GitHub Actions không tính phút.
name: Cap nhat Ban tin LPS
on:
  schedule:
    - cron: "*/30 0-10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ban-tin-lps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Chay script cap nhat
        run: python update_lps.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # để lưu bản sao tệp PDF vào mục Releases của kho
      - name: Lap danh sach tep can chuyen ve may co quan
        run: python deliver.py --list-only --days 3 --out giao
      - name: Luu ket qua
        run: |
          git config user.name "ban-tin-lps-bot"
          git config user.email "ban-tin-lps-bot@users.noreply.github.com"
          git add -A lps_db.json ban-tin-lps.html logo_lps.png giao
          git diff --cached --quiet || git commit -m "Cap nhat ban tin $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
